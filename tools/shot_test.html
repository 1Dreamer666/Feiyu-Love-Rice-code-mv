<!doctype html><html><body style="margin:0"><canvas id="c" width="800" height="400"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
x.fillStyle='#fff';x.fillRect(0,0,800,400);
x.fillStyle='#2e6bc4';x.beginPath();x.arc(400,200,120,0,7);x.fill();
x.fillStyle='#fff';x.font='48px sans-serif';x.fillText('CANVAS OK',250,210);
</script></body></html>
